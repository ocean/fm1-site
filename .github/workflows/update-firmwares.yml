# Builds FM-SWITCH's firmware list (firmwares.json, served at https://fm-1.drewr.dev/firmwares.json)
# with FM-SWITCH's fm1-catalogue tool, and commits it to main when it has changed. CI then checks
# and deploys it. On days when nothing changed, nothing is committed.
#
# Two jobs, so FM-SWITCH's code (and the packages it fetches) never holds a token that can write
# here: "build" runs the tool with read-only permissions; "publish" runs only this repository's own
# code, checks the file and commits it.
#
# When a source can't be read, fm1-catalogue keeps that source's firmwares from the last published
# list and exits 4. The list is still checked and published, then the run fails so someone looks.
name: Update the firmware list

on:
  schedule:
    - cron: "41 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-firmwares
  cancel-in-progress: false

jobs:
  build:
    name: Build the list
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      incomplete: ${{ steps.catalogue.outputs.incomplete }}
      problems: ${{ steps.catalogue.outputs.problems }}
    steps:
      - name: Check out this site (for the last published list)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
          persist-credentials: false

      - name: Check out FM-SWITCH
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ocean/FM-SWITCH
          ref: main
          path: app
          persist-credentials: false

      - name: Run fm1-catalogue
        id: catalogue
        working-directory: app
        env:
          # Read-only, and only for GitHub's API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/list"
          previous=()
          if [ -f ../site/firmwares.json ]; then
            previous=(--previous ../site/firmwares.json)
          fi
          problems="$RUNNER_TEMP/problems.txt"
          status=0
          swift run -c release fm1-catalogue --output "$RUNNER_TEMP/list/firmwares.json" "${previous[@]}" \
            2> "$problems" || status=$?
          cat "$problems" >&2
          if [ "$status" -eq 4 ]; then
            # Written, but a source couldn't be read: publish it, then fail the run.
            message=$(grep '^fm1-catalogue: ' "$problems" | sed 's/^fm1-catalogue: //' | tr '\n' ' ')
            echo "incomplete=true" >> "$GITHUB_OUTPUT"
            echo "problems=$message" >> "$GITHUB_OUTPUT"
            echo "::warning::$message"
            exit 0
          fi
          exit "$status"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmwares
          path: ${{ runner.temp }}/list/firmwares.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Check and publish the list
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # commit the list to main
      actions: write # start CI on it (pushes made with this token don't trigger workflows)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmwares
          path: ${{ runner.temp }}/list

      - name: Check the list
        run: node scripts/validate-firmwares.mjs "$RUNNER_TEMP/list/firmwares.json"

      - name: Commit it if it changed
        env:
          GH_TOKEN: ${{ github.token }}
          INCOMPLETE: ${{ needs.build.outputs.incomplete }}
          PROBLEMS: ${{ needs.build.outputs.problems }}
        run: |
          new="$RUNNER_TEMP/list/firmwares.json"
          # builtAt and the hub's own timestamp change on every run without the list changing.
          ignore='del(.builtAt, .hubUpdated)'
          if [ -f firmwares.json ] && cmp -s <(jq -S "$ignore" firmwares.json) <(jq -S "$ignore" "$new"); then
            echo "The firmware list hasn't changed: nothing to publish."
            exit 0
          fi
          cp "$new" firmwares.json
          count=$(jq '.entries | length' firmwares.json)
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sources="Built by FM-SWITCH's fm1-catalogue from the firmware hub, fm1-editor.com, aroum's FM1 Resource Hub and mutant.cloud."
          if [ "$INCOMPLETE" = "true" ]; then
            sources="$sources Incomplete: $PROBLEMS"
          fi
          git add firmwares.json
          git commit --message "Update the firmware list ($count firmwares)" --message "$sources"
          git pull --rebase "$remote" main
          git push "$remote" HEAD:main
          gh workflow run ci.yml --ref main

      - name: Fail if a source couldn't be read
        if: needs.build.outputs.incomplete == 'true'
        env:
          PROBLEMS: ${{ needs.build.outputs.problems }}
        run: |
          echo "### The firmware list is incomplete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$PROBLEMS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "It was checked and published anyway." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$PROBLEMS"
          exit 1
