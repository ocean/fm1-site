# Refreshes the FM-1 Moment's figures every week (and on demand): what each directory counts
# (fm1-moment/directories.json) and firmwares new to aroum's FM1 Resource Hub (fm1-moment/releases.csv).
# It never merges anything: it opens one pull request, "Refresh the FM-1 Moment", whose
# description lists every change for review. The build redraws the charts, the tables and the
# figures in the page's sentences from the data; the rest of the prose is a person's to check.
#
# Two jobs, so the code that reads other sites' data never holds a token that can write here:
# "refresh" runs with read-only permissions; "publish" pushes the branch and opens the pull request.
#
# Opening the pull request needs Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests". Without it, the branch is still pushed, ready to open a pull request from.
name: Refresh the FM-1 Moment

on:
  schedule:
    - cron: "17 21 * * 0" # Sundays, 21:17 UTC: Monday morning in Melbourne.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-fm1-moment
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the data
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
      problems: ${{ steps.refresh.outputs.problems }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Read the directories
        id: refresh
        env:
          # Read-only, and only for GitHub's API rate limit.
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/refresh/fm1-moment"
          node scripts/fm1-moment/refresh.mjs --report "$RUNNER_TEMP/refresh/report.md"
          cp fm1-moment/directories.json fm1-moment/releases.csv "$RUNNER_TEMP/refresh/fm1-moment/"
          cat "$RUNNER_TEMP/refresh/report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh
          path: ${{ runner.temp }}/refresh
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Open the pull request
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the refresh branch
      pull-requests: write # open or update its pull request
      actions: write # start CI on it (pushes made with this token don't trigger workflows)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refresh
          path: ${{ runner.temp }}/refresh

      - name: Push the branch and open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="refresh-fm1-moment"
          title="Refresh the FM-1 Moment"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # One refresh pull request at a time. While one is open, it may hold a person's edits,
          # so it's left alone: merge or close it, and the next refresh opens a new one.
          if [ "$(gh pr view "$branch" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            echo "::warning title=Refresh not opened::The last refresh's pull request is still open. Merge or close it; the next refresh starts from main."
            exit 0
          fi
          cp "$RUNNER_TEMP/refresh/fm1-moment/directories.json" "$RUNNER_TEMP/refresh/fm1-moment/releases.csv" fm1-moment/
          body="$RUNNER_TEMP/body.md"
          {
            echo "This week's refresh of the FM-1 Moment's data. Check each new firmware is an FM-1 firmware and its date is right; add any that shouldn't count to \`fm1-moment/not-counted.json\` with a reason. The charts and the figures in the text follow the data; check the rest of the page still reads true."
            echo
            cat "$RUNNER_TEMP/refresh/report.md"
          } > "$body"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add fm1-moment/directories.json fm1-moment/releases.csv
          git commit --message "$title" --message "Directory counts and new firmwares, from the weekly refresh."
          # A merged or closed refresh's branch is replaced.
          git push --force "$remote" "$branch"
          gh workflow run ci.yml --ref "$branch"
          if ! gh pr create --head "$branch" --title "$title" --body-file "$body"; then
            echo "::warning title=No pull request::Pushed $branch, but couldn't open a pull request. Allow GitHub Actions to create pull requests in the repository settings, or open one from the branch."
          fi

  problems:
    name: Fail if a source couldn't be read
    needs: refresh
    if: needs.refresh.outputs.problems == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo "::error::Some of the FM-1 Moment's sources couldn't be read: see the refresh job's summary."
          exit 1
