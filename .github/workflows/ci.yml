# Lints, builds and checks the site on every push and pull request, and deploys main to
# Cloudflare (fm-1.drewr.dev) once the checks pass.
#
# Deploying needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with the "Edit
# Cloudflare Workers" template, scoped to the drewr.dev zone) and CLOUDFLARE_ACCOUNT_ID.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run lint

      - run: npm run build

      - run: npm run check

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: .artifacts/check/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://fm-1.drewr.dev/
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Without the Cloudflare secrets (on a fork, or before they're set up), skip the deploy
      # with a warning rather than failing the run.
      - name: Check for Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Not deployed::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.credentials.outputs.ready == 'true'
        run: npm ci

      - if: steps.credentials.outputs.ready == 'true'
        run: npm run build

      - if: steps.credentials.outputs.ready == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
