# Scans the FM-1 firmwares on Felucca's update code for the bootloader check
# (https://fm-1.drewr.dev/bootloader-check/), and commits bootloader-check/data.json to main when
# it has changed. CI then checks and deploys it. On weeks when nothing changed, nothing is
# committed.
#
# Two jobs, so the repositories and packages the scan downloads never meet a token that can write
# here: "scan" runs the scanner with read-only permissions (it only parses what it downloads,
# never builds or runs it); "publish" runs only this repository's own code, checks the file and
# commits it.
name: Update the bootloader check

on:
  schedule:
    # Mondays, early morning UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-bootloader-check
  cancel-in-progress: false

jobs:
  scan:
    name: Scan the firmwares
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Run the scanner
        env:
          # Read-only, for GitHub's API and its rate limits. BOOTLOADER_SCAN_TOKEN, when it's set, is
          # a fine-grained personal token with read-only access to public repositories, for 5,000
          # requests an hour rather than this repository's 1,000; it's only ever given to this job.
          # Without it, the job's own token does. Code search may refuse either; the scan then goes
          # on without code search.
          GITHUB_TOKEN: ${{ secrets.BOOTLOADER_SCAN_TOKEN || github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/scan"
          node scripts/bootloader-check/scan.mjs \
            --previous bootloader-check/data.json \
            --catalogue firmwares.json \
            --output "$RUNNER_TEMP/scan/data.json" \
            --details "$RUNNER_TEMP/scan/details.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootloader-check
          path: |
            ${{ runner.temp }}/scan/data.json
            ${{ runner.temp }}/scan/details.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Check and publish the data
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # commit the data to main
      actions: write # start CI on it (pushes made with this token don't trigger workflows)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootloader-check
          path: ${{ runner.temp }}/scan

      - name: Check the data
        run: node scripts/validate-bootloader-check.mjs "$RUNNER_TEMP/scan/data.json" bootloader-check/overrides.json

      - name: Commit it if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new="$RUNNER_TEMP/scan/data.json"
          # checkedAt changes on every run without the data changing.
          ignore='del(.checkedAt)'
          if [ -f bootloader-check/data.json ] && cmp -s <(jq -S "$ignore" bootloader-check/data.json) <(jq -S "$ignore" "$new"); then
            echo "The bootloader check's data hasn't changed: nothing to publish."
            exit 0
          fi
          cp "$new" bootloader-check/data.json
          count=$(jq '.firmwares | length' bootloader-check/data.json)
          affected=$(jq '[.firmwares[] | select(.source.status == "affected")] | length' bootloader-check/data.json)
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootloader-check/data.json
          git commit --message "Update the bootloader check ($count firmwares, $affected affected)" \
            --message "Scanned by scripts/bootloader-check/scan.mjs: each firmware's default branch and latest release."
          git pull --rebase "$remote" main
          git push "$remote" HEAD:main
          gh workflow run ci.yml --ref main
